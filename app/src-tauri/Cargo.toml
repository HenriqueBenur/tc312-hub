[package]
name = "tc312-hub"
version = "1.0.1"
description = "Configurador do teclado Warrior TC312"
authors = ["TC312 Hub"]
edition = "2024"

[lib]
# O sufixo `_lib` evita conflito de nome entre lib e bin no Windows (cargo#8519)
name = "tc312_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
